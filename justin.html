<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Save Contact - Justin Bradshaw</title>

  <!-- AUTO-DOWNLOAD SCRIPT & META REFRESH -->
  <meta http-equiv="refresh" content="1; url=john.vcf">
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      // Trigger download after a slight 300ms delay to ensure page renders first
      setTimeout(() => {
        window.location.href = "justin.vcf";
      }, 300);
    });
  </script>

  <style>
    :root {
      --primary: #007aff;
      --bg: #f2f2f7;
      --card-bg: #ffffff;
      --text: #1c1c1e;
      --subtext: #8e8e93;
    }

    /* Dark mode support for modern mobile browsers */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --card-bg: #1c1c1e;
        --text: #ffffff;
        --subtext: #8e8e93;
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 20px;
      padding: 32px 24px;
      text-align: center;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
    }

    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #e5e5ea;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      font-size: 32px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 1.4rem;
      font-weight: 700;
    }

    .title {
      margin: 0 0 4px;
      font-size: 1rem;
      color: var(--subtext);
    }

    .company {
      margin: 0 0 24px;
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--primary);
    }

    .btn {
      display: block;
      background-color: var(--primary);
      color: #ffffff;
      text-decoration: none;
      padding: 14px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 1rem;
      transition: opacity 0.2s;
    }

    .btn:active {
      opacity: 0.8;
    }

    .status-text {
      margin-top: 16px;
      font-size: 0.8rem;
      color: var(--subtext);
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="avatar">👤</div>
    <h1>Justin Bradshaw</h1>
    <p class="company">KOPILOT.ID</p>

    <!-- MANUAL BACKUP BUTTON -->
    <a href="justin.vcf" class="btn">Save Contact</a>

    <p class="status-text">
      Download will start automatically...<br>
      If nothing happens, tap the button above.
    </p>
  </div>

</body>
</html>
